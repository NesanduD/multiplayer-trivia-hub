# Trivia Hub server configuration (override via file, env, or CLI args)
server.name=Trivia-Hub
server.tcpPort=5000
server.httpPort=8080
server.wsPort=5001
server.statsPath=data/match-history.json

# Application heartbeat: clients should PING at ~interval; idle beyond timeout is soft-disconnected
heartbeat.intervalMs=5000
heartbeat.timeoutMs=20000

# Soft-disconnect recovery window before the seat is released
session.recoverWindowMs=60000

# Ordered game/room work off the NIO selector thread
dispatch.workers=8

# Game rules
game.questionSeconds=15
game.questionsPerMatch=5
game.pointsPerCorrect=10
